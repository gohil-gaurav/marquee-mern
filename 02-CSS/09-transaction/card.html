<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

<div class="container">

    <div class="card">
        <div class="circle"></div>
        <img src="https://imgs.search.brave.com/8DjHQghGXwbvm5SeQWTvOB3MUrmlWV8Pjp93Gwtcl-Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90NC5m/dGNkbi5uZXQvanBn/LzA0LzIzLzkxLzY1/LzM2MF9GXzQyMzkx/NjU1MV9rS3RCcFRh/dEFKd2lGR1NJeWU4/Z3VkSko1cnJJdlRO/Vy5qcGc"
            class="profile">

        <h2>John Doe</h2>
        <p>Anime Character</p>

        <div class="stats">
            
            <div>
                <h3>100</h3>
                <span>Posts</span>
            </div>

            <div>
                <h3>940k</h3>
                <span>Followers</span>
            </div>

            <div>
                <h3>185</h3>
                <span>Following</span>
            </div>

        </div>

        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>

    </div>

</div>

</body>
</html>
