<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Flexbox</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.section{
    background:white;
    padding:20px;
    margin-bottom:30px;
    border-radius:10px;
}

.flex-container{
    display:flex;
    gap:15px;
    margin-top:20px;
}

.box{
    width:100px;
    height:100px;
    background:steelblue;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;
    font-weight:bold;
}

.justify-demo{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.align-demo{
    display:flex;
    align-items:center;
    height:200px;
    border:2px dashed gray;
    margin-top:20px;
}

.direction-demo{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
}

</style>
</head>
<body>

<div class="container">

    <h1>CSS Flexbox</h1>

    <div class="section">

        <h2>Display Flex</h2>

        <div class="flex-container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

    </div>

    <div class="section">

        <h2>Justify Content</h2>

        <div class="justify-demo">
            <div class="box">A</div>
            <div class="box">B</div>
            <div class="box">C</div>
        </div>

    </div>

    <div class="section">

        <h2>Align Items</h2>

        <div class="align-demo">
            <div class="box">X</div>
            <div class="box">Y</div>
            <div class="box">Z</div>
        </div>

    </div>

    <div class="section">

        <h2>Flex Direction Column</h2>

        <div class="direction-demo">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

    </div>

</div>

</body>
</html>
