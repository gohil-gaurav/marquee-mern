<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>

    <style>

        /* Color Names */
        .color-name {
            color: red;
        }

        /* RGB Colors */
        .rgb-color {
            color: rgb(0, 128, 255);
        }

        /* HEX Colors */
        .hex-color {
            color: #00aa00;
        }

        /* Background Colors */
        .background-example {
            background-color: yellow;
            padding: 10px;
        }

    </style>

</head>
<body>

    <h1>CSS Colors Examples</h1>

    <hr>

    <h2>1. Color Names</h2>
    <p class="color-name">
        This text uses a color name (red).
    </p>

    <hr>

    <h2>2. RGB Colors</h2>
    <p class="rgb-color">
        This text uses RGB color.
    </p>

    <hr>

    <h2>3. HEX Colors</h2>
    <p class="hex-color">
        This text uses HEX color.
    </p>

    <hr>

    <h2>4. Background Color</h2>
    <p class="background-example">
        This paragraph has a yellow background.
    </p>

</body>
</html>
