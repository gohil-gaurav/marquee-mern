<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.grid-container{
    display:grid;

    grid-template-columns: repeat(3, 1fr);

    gap:20px;

    margin-top:30px;
}

.box{
    background:steelblue;
    color:white;

    padding:40px;

    text-align:center;

    font-size:24px;
    font-weight:bold;

    border-radius:10px;
}

.box1{
    grid-column:1 / 3;
}

.box5{
    grid-row:3 / 5;
}

</style>
</head>
<body>

<div class="container">

    <h1>CSS Grid Layout</h1>

    <div class="grid-container">

        <div class="box box1">1</div>

        <div class="box">2</div>

        <div class="box">3</div>

        <div class="box">4</div>

        <div class="box box5">5</div>

        <div class="box">6</div>

        <div class="box">7</div>

        <div class="box">8</div>

    </div>

</div>

</body>
</html>
