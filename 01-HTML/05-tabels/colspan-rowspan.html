<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan and Rowspan</title>
</head>
<body>

    <h1>Colspan and Rowspan Example</h1>

    <table border="1">

        <tr>
            <th colspan="2">Student Info</th>
        </tr>

        <tr>
            <td>Name</td>
            <td>Gaurav</td>
        </tr>

        <tr>
            <td rowspan="2">Skills</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>CSS</td>
        </tr>

    </table>

</body>
</html>
