<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Table</title>
</head>
<body>

    <h1>Basic HTML Table</h1>

    <table border="1">

        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>

        <tr>
            <td>Gaurav</td>
            <td>20</td>
            <td>Vadodara</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>21</td>
            <td>Ahmedabad</td>
        </tr>

    </table>

</body>
</html>
